apiVersion: v1
kind: Namespace
metadata:
  name: oficina
---
# Credenciais vêm do Secret rabbitmq-credentials (criado por local/secrets.sh).
# Sem volume persistente: é um ambiente local descartável; as filas são
# redeclaradas pelos serviços na subida.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: oficina
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: oficina
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          # Imagem oficial com o plugin rabbitmq_management já habilitado.
          image: rabbitmq:4.2.9-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_DEFAULT_VHOST
              value: /
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# AMQP: acesso interno ao cluster (spring.rabbitmq.host=rabbitmq).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: oficina
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: oficina
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
# Painel de management: NodePort 31672, publicado em 127.0.0.1:31672 pelo kind.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
  namespace: oficina
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: oficina
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: management
      port: 15672
      targetPort: management
      nodePort: 31672
