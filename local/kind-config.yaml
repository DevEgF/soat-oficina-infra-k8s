# Cluster kind local da Fase 4: um nó, portas publicadas só em 127.0.0.1.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: oficina
nodes:
  - role: control-plane
    extraPortMappings:
      # OS Service
      - containerPort: 30081
        hostPort: 30081
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Billing Service
      - containerPort: 30082
        hostPort: 30082
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Execution Service
      - containerPort: 30083
        hostPort: 30083
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Painel de management do RabbitMQ
      - containerPort: 31672
        hostPort: 31672
        listenAddress: "127.0.0.1"
        protocol: TCP
