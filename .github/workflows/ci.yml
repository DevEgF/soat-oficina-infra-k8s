name: terraform

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true

jobs:
  validate:
    name: terraform / validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without remote state
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate
      - name: Run Terraform tests
        run: terraform test
      - name: Verify application log transport locally
        run: python3 scripts/test-log-transport.py

  security:
    name: terraform / security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
      - name: Initialize without remote state
        run: terraform init -backend=false -input=false
      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - name: Initialize TFLint
        run: tflint --init
      - name: Run TFLint
        run: tflint --recursive
      # Match the locally validated scanner; the Action image runs Checkov 2.0.930.
      - name: Install Checkov
        run: |
          python3 -m venv "${RUNNER_TEMP}/checkov"
          "${RUNNER_TEMP}/checkov/bin/python" -m pip install checkov==3.3.16
      - name: Run Checkov
        run: '"${RUNNER_TEMP}/checkov/bin/checkov" -d . --framework terraform --quiet'
