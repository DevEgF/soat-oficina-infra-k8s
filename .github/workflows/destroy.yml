name: destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment used for approval and OIDC
        required: true
        type: choice
        options:
          - hml
          - prod
      confirmation:
        description: Type DESTROY-soat-oficina
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_IN_AUTOMATION: true

jobs:
  destroy:
    name: destroy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: infra-k8s-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate typed confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test "${CONFIRMATION}" = "DESTROY-soat-oficina" || { echo "Invalid destruction confirmation"; exit 1; }
          test -n "${AWS_REGION}" || { echo "AWS_REGION is required"; exit 1; }
          test -n "${AWS_ROLE_ARN}" || { echo "AWS_ROLE_ARN is required"; exit 1; }
          test -n "${TF_STATE_BUCKET}" || { echo "TF_STATE_BUCKET is required"; exit 1; }
          test -n "${TF_VAR_alert_email}" || { echo "ALERT_EMAIL is required"; exit 1; }
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize exact remote state
        run: >-
          terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="region=${AWS_REGION}"
      - name: Create saved destroy plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan
      - name: Upload saved destroy plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-k8s-destroy-${{ inputs.environment }}-${{ github.run_id }}
          path: destroy.tfplan
          if-no-files-found: error
          retention-days: 7
      - name: Apply saved destroy plan
        run: terraform apply -input=false destroy.tfplan
